<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>echo word</title>
</head>
<body>
  <header class="popup-header">
    <span class="brand">echo word</span>
  </header>

  <nav class="tab-bar" role="tablist">
    <button
      type="button"
      class="tab-btn"
      role="tab"
      data-tab="current"
      aria-selected="true"
    >当前站点</button>
    <button
      type="button"
      class="tab-btn"
      role="tab"
      data-tab="all"
      aria-selected="false"
    >全部网站</button>
  </nav>

  <!-- Tab 1：当前站点 -->
  <section class="tab-panel" data-panel="current" role="tabpanel">
    <div class="row">
      <div class="row-text">
        <div class="site-host" id="site"></div>
        <div class="row-desc" id="siteDesc"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled" aria-label="在此网站启用" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
    <p class="hint" id="hint" hidden></p>
  </section>

  <!-- Tab 2：全部网站（仅全局总开关） -->
  <section class="tab-panel" data-panel="all" role="tabpanel" hidden>
    <div class="row">
      <div class="row-text">
        <div class="row-title">全部网站</div>
        <div class="row-desc" id="allDesc"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="global" aria-label="全部网站启用" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
  </section>

  <footer class="popup-footer">
    <button type="button" id="openOptions" class="link-btn">打开完整设置</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
