<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoWord</title>
</head>
<body>
  <nav class="top-nav">
    <a href="/options.html" class="nav-tab" data-i18n="navSettings"></a>
    <a href="/wordbook.html" class="nav-tab active" data-i18n="navWordbook"></a>
  </nav>
  <header class="wb-header">
    <h1 data-i18n="wordbookTitle"></h1>
    <span class="wb-count" id="count"></span>
  </header>

  <p class="wb-backup-hint" id="backupHint" data-i18n="wordbookBackupHint"></p>
  <div class="wb-backup-actions">
    <button type="button" class="wb-backup-btn" id="exportBtn" data-i18n="wordbookExport"></button>
    <button type="button" class="wb-backup-btn" id="importBtn" data-i18n="wordbookImport"></button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <span class="wb-backup-status" id="importStatus" role="status"></span>
  </div>

  <p class="wb-empty" id="empty" data-i18n="wordbookEmpty" hidden></p>

  <main class="wb-list" id="list"></main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
