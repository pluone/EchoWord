<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoWord</title>
</head>
<body>
  <header class="popup-header">
    <span class="brand">EchoWord</span>
  </header>

  <nav class="tab-bar" role="tablist">
    <button
      type="button"
      class="tab-btn"
      role="tab"
      data-tab="current"
      data-i18n="tabCurrent"
      aria-selected="true"
    ></button>
    <button
      type="button"
      class="tab-btn"
      role="tab"
      data-tab="all"
      data-i18n="tabAll"
      aria-selected="false"
    ></button>
  </nav>

  <!-- Tab 1：当前站点 -->
  <section class="tab-panel" data-panel="current" role="tabpanel">
    <div class="row">
      <div class="row-text">
        <div class="site-host" id="site"></div>
        <div class="row-desc" id="siteDesc"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled" data-i18n-aria-label="ariaEnableSite" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
    <p class="hint" id="hint" hidden></p>
  </section>

  <!-- Tab 2：全部网站（仅全局总开关） -->
  <section class="tab-panel" data-panel="all" role="tabpanel" hidden>
    <div class="row">
      <div class="row-text">
        <div class="row-title" data-i18n="allSitesTitle"></div>
        <div class="row-desc" id="allDesc"></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="global" data-i18n-aria-label="ariaEnableAll" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </div>
  </section>

  <footer class="popup-footer">
    <button type="button" id="openWordbook" class="link-btn" data-i18n="openWordbook"></button>
    <button type="button" id="openOptions" class="link-btn" data-i18n="openFullSettings"></button>
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
