<!-- EchoWord 弹窗结构（Shadow DOM 模板，${chrome.i18n.getMessage(...)} 占位符由 index.ts 求值替换）。 -->
<div class="popup">
  <div class="head">
    <button class="btn speak" type="button" title="${chrome.i18n.getMessage('speakLabel')}" aria-label="${chrome.i18n.getMessage('speakLabel')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <span class="word"></span>
    <span class="phons"></span>
    <button class="btn save" type="button" title="${chrome.i18n.getMessage('saveWordLabel')}" aria-label="${chrome.i18n.getMessage('saveWordLabel')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.3-4.1 5.9-.8z"/></svg></button>
    <button class="btn close" type="button" title="${chrome.i18n.getMessage('closeLabel')}" aria-label="${chrome.i18n.getMessage('closeLabel')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="body" hidden>
    <div class="defs"></div>
    <div class="trans" hidden></div>
  </div>
  <div class="foot">
    <button class="fbtn speak-word" type="button"></button>
    <button class="fbtn speak-sentence" type="button"></button>
  </div>
  <span class="catch"></span>
</div>
