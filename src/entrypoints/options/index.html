<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="manifest.open_in_tab" content="true" />
  <title data-i18n="optionsTitle"></title>
</head>

  <body>
  <nav class="top-nav">
    <a href="/options.html" class="nav-tab active" data-i18n="navSettings"></a>
    <a href="/wordbook.html" class="nav-tab" data-i18n="navWordbook"></a>
  </nav>
  <main class="page-body">
    <h1 data-i18n="optionsTitle"></h1>

    <section class="field">
      <label for="voice" data-i18n="loadVoiceLabel"></label>
      <div class="voice-row">
        <select id="voice"></select>
        <button id="preview" type="button" data-i18n="previewButton"></button>
        <button id="exclude" type="button" data-i18n="excludeButton"></button>
      </div>
      <p id="sampleText" class="sample" hidden></p>
      <p class="hint" id="voiceHint"></p>
    </section>

    <section class="field">
      <button type="button" id="excludedToggle" class="excluded-toggle" aria-expanded="false">
        <span class="excluded-arrow" aria-hidden="true">▶</span>
        <span data-i18n="excludedVoicesLabel"></span>
        <span id="excludedCount" class="excluded-count"></span>
      </button>
      <div id="excludedBody" class="excluded-body" hidden>
        <ul id="excludedList" class="excluded-list"></ul>
        <p class="hint" id="excludedHint"></p>
      </div>
    </section>

    <section class="field">
      <div class="ctrl-row">
        <div class="ctrl-col">
          <div class="field-head">
            <label for="volume" data-i18n="volumeLabel"></label>
            <output id="volumeValue" for="volume">100%</output>
          </div>
          <input type="range" id="volume" min="0" max="100" step="1" value="100" />
          <div class="ticks" id="volumeTicks"></div>
        </div>
        <div class="ctrl-col">
          <div class="field-head">
            <label for="rate" data-i18n="rateLabel"></label>
            <output id="rateValue" for="rate">1.0×</output>
          </div>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
          <div class="ticks" id="rateTicks"></div>
        </div>
      </div>
    </section>

    <section class="field">
      <label data-i18n="hoverDelayLabel"></label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="300" />
          <span data-i18n="hoverDelay0300"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="600" />
          <span data-i18n="hoverDelay0600"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="1000" />
          <span data-i18n="hoverDelay1000"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="1500" />
          <span data-i18n="hoverDelay1500"></span>
        </label>
      </div>
    </section>

    <section class="field">
      <label data-i18n="popupModeLabel"></label>
      <div class="radio-group" id="popupModeMac">
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_click" />
          <span data-i18n="popupModeHoverClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover" />
          <span data-i18n="popupModeHover"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="click" />
          <span data-i18n="popupModeClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="alt_click" />
          <span data-i18n="popupModeAltClickMac"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="command_click" />
          <span data-i18n="popupModeCommandClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_command" />
          <span data-i18n="popupModeHoverCommand"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_control" />
          <span data-i18n="popupModeHoverControlMac"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="disable" />
          <span data-i18n="popupModeDisable"></span>
        </label>
      </div>
      <div class="radio-group" id="popupModeWindows" hidden>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_click" />
          <span data-i18n="popupModeHoverClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover" />
          <span data-i18n="popupModeHover"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="click" />
          <span data-i18n="popupModeClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="alt_click" />
          <span data-i18n="popupModeAltClickWin"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="control_click" />
          <span data-i18n="popupModeControlClick"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_control" />
          <span data-i18n="popupModeHoverControlWin"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="disable" />
          <span data-i18n="popupModeDisable"></span>
        </label>
      </div>
      <p class="hint" data-i18n="popupModeHint"></p>
    </section>

    <section class="field">
      <label data-i18n="translatorLabel"></label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="translator" value="google" />
          <span data-i18n="translatorGoogle"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="translator" value="bing" />
          <span data-i18n="translatorBing"></span>
        </label>
      </div>
      <p class="hint" data-i18n="translatorHint"></p>
    </section>

    <section class="field">
      <label data-i18n="phoneticsLabel"></label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="phonetics" value="us" />
          <span data-i18n="phoneticsUs"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="phonetics" value="uk" />
          <span data-i18n="phoneticsUk"></span>
        </label>
      </div>
      <p class="hint" data-i18n="phoneticsHint"></p>
    </section>

    <section class="field">
      <label data-i18n="sentenceBreakLabel"></label>
      <div class="radio-group" id="sentenceBreakGroup">
        <label class="radio-row">
          <input type="radio" name="sentenceBreak" value="comma" />
          <span data-i18n="sentenceBreakComma"></span>
        </label>
        <label class="radio-row">
          <input type="radio" name="sentenceBreak" value="period" />
          <span data-i18n="sentenceBreakPeriod"></span>
        </label>
      </div>
    </section>

    <section class="field">
      <label data-i18n="basicOptionsLabel"></label>
      <div class="checkbox-row">
        <input type="checkbox" id="autoSpeak" />
        <label for="autoSpeak" data-i18n="autoSpeakLabel"></label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="sentenceSpeak" />
        <label for="sentenceSpeak" data-i18n="sentenceSpeakLabel"></label>
      </div>
      <div class="checkbox-row indent" id="wordFirstRow">
        <input type="checkbox" id="wordFirst" />
        <label for="wordFirst" data-i18n="wordFirstLabel"></label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="stickyPopup" />
        <label for="stickyPopup" data-i18n="stickyPopupLabel"></label>
      </div>
    </section>

    <section class="field">
      <label for="previewText" data-i18n="customPreviewLabel"></label>
      <textarea id="previewText" rows="3" data-i18n-placeholder="previewTextPlaceholder"></textarea>
      <button type="button" id="previewCustom" class="preview-custom" data-i18n="previewPlayButton"></button>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>

</html>
