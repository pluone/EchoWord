<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="options.css" />
  <title>EchoWord 设置</title>
</head>

<body>
  <main>
    <h1>EchoWord 设置</h1>

    <section class="field">
      <label for="voice">朗读声音</label>
      <div class="voice-row">
        <select id="voice"></select>
        <button id="preview" type="button">试听</button>
        <button id="exclude" type="button">剔除</button>
      </div>
      <p id="sampleText" class="sample" hidden></p>
      <p class="hint" id="voiceHint"></p>
    </section>

    <section class="field">
      <button type="button" id="excludedToggle" class="excluded-toggle" aria-expanded="false">
        <span class="excluded-arrow" aria-hidden="true">▶</span>
        <span>已剔除声音</span>
        <span id="excludedCount" class="excluded-count"></span>
      </button>
      <div id="excludedBody" class="excluded-body" hidden>
        <ul id="excludedList" class="excluded-list"></ul>
        <p class="hint" id="excludedHint"></p>
      </div>
    </section>

    <section class="field">
      <div class="ctrl-row">
        <div class="ctrl-col">
          <div class="field-head">
            <label for="volume">音量</label>
            <output id="volumeValue" for="volume">100%</output>
          </div>
          <input type="range" id="volume" min="0" max="100" step="1" value="100" />
          <div class="ticks" id="volumeTicks"></div>
        </div>
        <div class="ctrl-col">
          <div class="field-head">
            <label for="rate">播放速度</label>
            <output id="rateValue" for="rate">1.0×</output>
          </div>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
          <div class="ticks" id="rateTicks"></div>
        </div>
      </div>
    </section>

    <section class="field">
      <label>悬停弹出延迟</label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="300" />
          <span>0.3 秒</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="600" />
          <span>0.6 秒（默认）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="1000" />
          <span>1.0 秒</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="hoverDelay" value="1500" />
          <span>1.5 秒</span>
        </label>
      </div>
    </section>

    <section class="field">
      <label>弹窗触发方式（Pop-up mode）</label>
      <div class="radio-group" id="popupModeMac">
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_click" />
          <span>悬停或点击单词/短语即可打开弹窗（默认）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover" />
          <span>仅悬停单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="click" />
          <span>仅点击或轻触单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="alt_click" />
          <span>仅按住 Option 键点击单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="command_click" />
          <span>仅按住 Command 键点击单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_command" />
          <span>仅悬停单词/短语后按下 Command 键时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_control" />
          <span>仅悬停单词/短语后按下 Control 键时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="disable" />
          <span>禁用弹窗</span>
        </label>
      </div>
      <div class="radio-group" id="popupModeWindows" hidden>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_click" />
          <span>悬停或点击单词/短语即可打开弹窗（默认）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover" />
          <span>仅悬停单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="click" />
          <span>仅点击或轻触单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="alt_click" />
          <span>仅按住 Alt 键点击单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="control_click" />
          <span>仅按住 Ctrl 键点击单词/短语时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="hover_control" />
          <span>仅悬停单词/短语后按下 Ctrl 键时打开弹窗</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="popupMode" value="disable" />
          <span>禁用弹窗</span>
        </label>
      </div>
      <p class="hint">选择弹窗的打开方式，选项随系统类型显示。</p>
    </section>

    <section class="field">
      <label>整句翻译引擎</label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="translator" value="google" />
          <span>谷歌翻译（默认）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="translator" value="bing" />
          <span>必应翻译</span>
        </label>
      </div>
      <p class="hint">悬停卡片里句子中文译文所使用的翻译服务。</p>
    </section>

    <section class="field">
      <label>弹窗音标</label>
      <div class="radio-group">
        <label class="radio-row">
          <input type="radio" name="phonetics" value="us" />
          <span>美式（默认）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="phonetics" value="uk" />
          <span>英式</span>
        </label>
      </div>
      <p class="hint">悬停卡片里展示哪种音标（只显示一种）。</p>
    </section>

    <section class="field">
      <label>朗读整句时，如何断句</label>
      <div class="radio-group" id="sentenceBreakGroup">
        <label class="radio-row">
          <input type="radio" name="sentenceBreak" value="comma" />
          <span>断句到逗号（句子更短，更易把握）</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="sentenceBreak" value="period" />
          <span>断句到句号（默认）</span>
        </label>
      </div>
    </section>

    <section class="field">
      <label>基础选项</label>
      <div class="checkbox-row">
        <input type="checkbox" id="autoSpeak" />
        <label for="autoSpeak">弹窗出现后自动播放发音</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="sentenceSpeak" />
        <label for="sentenceSpeak">使用 TTS 朗读整句，而非单个单词</label>
      </div>
      <div class="checkbox-row indent" id="wordFirstRow">
        <input type="checkbox" id="wordFirst" />
        <label for="wordFirst">先朗读单词，再朗读整句</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="stickyPopup" />
        <label for="stickyPopup">仅在点击外部、点击 X 图标或按 Esc 时关闭弹窗</label>
      </div>
    </section>

    <section class="field">
      <label for="previewText">自定义试听</label>
      <textarea id="previewText" rows="3" placeholder="输入或粘贴一段文字，点击「播放」用当前选中的声音朗读试听……"></textarea>
      <button type="button" id="previewCustom" class="preview-custom">▶ 播放</button>
    </section>
  </main>
  <script src="options.js"></script>
</body>

</html>
